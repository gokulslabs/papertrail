<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f6f6a" />
    <title>Offline · Privytrail</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4ef;
        --fg: #1c1b18;
        --muted: #686459;
        --primary: #1f6f6a;
        --card: #fffefb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12141a;
          --fg: #eceae4;
          --muted: #9a968c;
          --card: #1a1d26;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 1.5rem;
      }
      main {
        max-width: 22rem;
        text-align: center;
        background: var(--card);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Privytrail couldn’t reach the network. If you’ve opened the app before, your library on this
        device may still work once you’re back online — or try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
